<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Springfield Page</title>

    <link rel="icon" type="image/x-icon" href="./images/favicon.png">
    <link rel="stylesheet" href="./css/springfield.css">
    <script src="./javascript/springfield.js" defer></script>
</head>
<body>

<header class="headContainer">
        <div id="logoContainer">
            <a href="./home.html">
                <img src="./images/logo.png" alt="simpsons logo">
            </a>
        </div>
        <h1>The Simpsons Page</h1>
    </header>
    <nav class="navContainer">
        <a class="active" href="../springfield.html">Springfield</a>
        <a href="./characters/characters.html">Characters</a>
        <a href="./forum/html/forum.html">Forum</a>
    </nav> 

    <!-- Back button (hidden by default) -->
    <button id="backBtn" class="hidden">← Back</button>

    <div id="mainContainer"> <!-- Main Content -->
        <h2>Kwik-E-Mart</h2>
        <div id="firstView"> <!-- Start of First View -->
            <div class="galleryContainer"> <!-- 1st Row of Images -->
                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/frontkwikemart.png" class="singleImg" alt="frontkwikemart">
                </div>

                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/kwikenight.png" class="singleImg" alt="kwikenihgt">
                </div>

                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/brickemart.png" class="singleImg" alt="brickemart">
                </div>

                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/alley.png" class="singleImg" alt="alley">
                </div>
            </div> <!-- End of 1st Row of Images -->

            <div class="galleryContainer"> <!-- 2nd Row of Images -->
                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/entrance.png" class="singleImg" alt="entrance">
                </div>

                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/overflow.png" class="singleImg" alt="overflow">
                </div>

                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/healthviolation.png" class="singleImg" alt="healthviolation">
                </div>

                <div class="imgContainer">
                    <img src="./images/kwik_e_mart/robbery.png" class="singleImg" alt="robbery">
                </div>
            </div> <!-- End of 2nd Row of Images -->
        </div> <!-- End of First View -->
    </div> <!-- End Of Main Content -->

    <div class="smallContainer">
        <div id="singleImageView" class="hidden">
            <img id="singleImage" src="" alt="Selected">
        </div>
    </div>
</body>
</html>
