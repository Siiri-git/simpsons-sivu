<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">

        <title>Message Board</title>

        <link rel="icon" type="image/x-icon" href="./images/favicon.png">
        <link rel="stylesheet" href="../css/forum.css">
    </head>
    <body>
        <header class="headContainer">
            <div id="logoContainer">
                <a href="./home.html">
                    <img src="./images/logo.png" alt="simpsons logo">
                </a>
            </div>
            <h1>The Simpsons Page</h1>
        </header>
        <nav class="navContainer">
            <a href="./springfield/springfield.html">Springfield</a>
            <a href="./characters/characters.html">Characters</a>
            <a class="active" href="forum.html">Forum</a>
        </nav>

        <main>
            <button id="newMsgBtn">New Message</button>

            <div id="messageList"></div>

            <dialog id="msgDialog">
                <form id="msgForm" method="dialog">
                    <label>Name:
                        <input type="text" id="senderInput" required>
                    </label>

                    <label>Title:
                        <input type="text" id="titleInput" required>
                    </label>

                    <textarea id="bodyInput" placeholder="Write your message..." required></textarea>

                    <div class="btn-row">
                        <button type="button" id="cancelBtn">Cancel</button>
                        <button type="submit" id="sendBtn">Send</button>
                    </div>
                </form>
            </dialog>
        </main>
        <br>
        <script src="../javaScript/forum.js"></script>
    </body>
</html>
