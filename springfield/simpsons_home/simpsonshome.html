    <header class="headContainer">

                <img src="/images/logo.png" alt="simpsons logo">

        </div>
        <h1>The Simpsons Page</h1>

    <nav class="navContainer">

        <div id="firstView">
            <div class="galleryContainer"> <!-- singleImage 1st Row of Images -->
                <div class="imgContainer">
                    <img src="/images/simpsons_house/mastbedroom.jpg" class="singleImg" alt="masterbedroom">

                <div class="imgContainer">

                    <img src="/images/simpsons_house/rumpusroom.png" class="singleImg" alt="rumpus">

                </div>

                </div>
